<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청소분담 결과</title>
  <style>
    :root {
      --ink: #263238;
      --muted: #74808b;
      --line: #e9edf2;
      --mint: #c8f2e8;
      --sky: #dcefff;
      --lavender: #eadffc;
      --cream: #fff4cc;
      --pink: #ffe2ec;
      --shadow: 0 18px 44px rgba(56, 72, 92, .11);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fff 0%, #f8fcff 54%, #fffaf0 100%);
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    img { display: block; max-width: 100%; }
    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px 14px 42px;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
      padding: 12px 2px 18px;
    }
    h1 { margin: 0; font-size: clamp(28px, 8vw, 44px); line-height: 1.08; font-weight: 950; }
    .meta {
      margin: 10px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #5d6a75;
      font-weight: 850;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      border: 1px solid var(--line);
    }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid var(--line);
      color: #43515d;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(56,72,92,.06);
    }
    .btn.primary {
      background: linear-gradient(135deg, #8bded2, #bba8ef);
      color: #fff;
      border-color: transparent;
    }
    .section-title {
      margin: 26px 2px 12px;
      font-size: 19px;
      font-weight: 950;
    }
    .mine {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 18px;
      padding: 22px;
      border-radius: 30px;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .visual {
      min-height: 150px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      font-size: 70px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.65),
        0 16px 30px rgba(62, 78, 92, .08);
    }
    .mine h2 { margin: 0; font-size: 30px; line-height: 1.12; font-weight: 950; }
    .mine-list {
      display: grid;
      gap: 14px;
    }
    .mine.empty {
      grid-template-columns: 1fr;
      text-align: center;
      color: #66727e;
      font-weight: 900;
      line-height: 1.55;
    }
    .summary { margin: 8px 0 0; color: #52616d; font-size: 16px; font-weight: 800; line-height: 1.42; }
    .owner { margin: 10px 0 0; color: #7b8792; font-size: 14px; font-weight: 900; }
    .checks { display: grid; gap: 8px; margin: 16px 0 0; }
    .check {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 42px;
      padding: 9px 12px;
      border-radius: 15px;
      background: #f8fafc;
      color: #43515d;
      font-weight: 800;
    }
    .check input { width: 18px; height: 18px; accent-color: #7fd5c9; }
    .detail-link {
      margin-top: 15px;
      padding: 0;
      background: transparent;
      color: #8a7bc6;
      font-weight: 950;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .role-card {
      min-height: 176px;
      padding: 14px;
      border-radius: 22px;
      background: rgba(255,255,255,.95);
      border: 1px solid var(--line);
      box-shadow: 0 12px 28px rgba(56,72,92,.07);
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .role-card.mine-card { border-color: #bba8ef; box-shadow: 0 16px 34px rgba(132,112,176,.17); }
    .mini-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .seat-badge {
      min-width: 46px;
      height: 32px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #f4f7fb;
      color: #52616d;
      font-weight: 950;
    }
    .thumb {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 25px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.62);
    }
    .role-card h3 { margin: 0; font-size: 16px; line-height: 1.25; font-weight: 950; }
    .role-card p { margin: 0; color: #697683; font-size: 13px; line-height: 1.4; font-weight: 750; }
    .role-stack {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .role-stack li {
      padding: 7px 8px;
      border-radius: 12px;
      background: #f8fafc;
      color: #56616d;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.35;
    }
    .empty-role {
      color: #9aa4ae;
      font-weight: 850;
    }
    .role-card .detail-link { margin-top: 2px; justify-self: start; font-size: 13px; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 14px;
      background: rgba(37,45,55,.34);
    }
    .modal.open { display: flex; }
    .sheet {
      width: min(620px, 100%);
      max-height: min(88vh, 820px);
      overflow: auto;
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(35,45,58,.24);
      padding: 18px;
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      padding-bottom: 12px;
    }
    .sheet h2 { margin: 0; font-size: 24px; font-weight: 950; }
    .sheet .owner { margin-top: 6px; }
    .close {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: #f5f7fa;
      color: #5e6974;
      font-weight: 950;
      font-size: 22px;
    }
    .map {
      min-height: 210px;
      border-radius: 24px;
      overflow: hidden;
      background: #f6f7fb;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
    }
    .map img, .sign-image img {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      background: #fff;
    }
    .image-fallback {
      min-height: 210px;
      width: 100%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef9f6, #f4efff);
      color: #82909c;
      font-weight: 950;
    }
    .detail-block {
      margin-top: 14px;
      padding: 15px;
      border-radius: 20px;
      background: #f9fbfd;
    }
    .detail-block strong { display: block; margin-bottom: 6px; font-size: 13px; color: #66727f; }
    .detail-block p { margin: 0; color: #394852; line-height: 1.48; font-weight: 800; }
    .sign-sheet { text-align: center; }
    .sign-image {
      min-height: 190px;
      margin: 14px 0;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #f8fafc;
      display: grid;
      place-items: center;
    }
    .complete-pop {
      width: 72px;
      height: 72px;
      margin: 0 auto 12px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #c8f2e8, #eadffc);
      font-size: 34px;
      animation: pop .5s ease-out both;
    }
    @keyframes pop {
      0% { transform: scale(.65); opacity: 0; }
      70% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    .sign-message {
      margin: 0;
      color: #52616d;
      font-weight: 850;
      line-height: 1.5;
    }
    .sign-ok {
      width: 100%;
      min-height: 50px;
      margin-top: 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #8bded2, #bba8ef);
      color: #fff;
      font-weight: 950;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 30;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      background: #263238;
      color: #fff;
      font-weight: 900;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .shoe { background: #ffd5ce; }
    .front { background: #fff1ad; }
    .living { background: #dff2bf; }
    .toilet { background: #dceeff; }
    .sink { background: #ffe0eb; }
    .shower { background: #eee4ff; }
    .trash { background: #ded5ff; }
    @media (max-width: 760px) {
      .top { grid-template-columns: 1fr; align-items: start; }
      .top-actions { justify-content: start; }
      .mine { grid-template-columns: 1fr; }
      .visual { min-height: 132px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px) {
      .wrap { padding-inline: 10px; }
      .mine { padding: 18px; border-radius: 26px; }
      .grid { grid-template-columns: 1fr; }
      .top-actions .btn { flex: 1; }
    }
    @media print {
      @page { margin: 12mm; }
      body { background: #fff; color: #111; }
      .wrap { width: 100%; padding: 0; }
      .top { display: block; padding: 0 0 10px; }
      .top-actions, .detail-link, .modal, .toast, .checks { display: none !important; }
      .pill { border: 1px solid #ddd; background: #fff; }
      .mine, .role-card {
        box-shadow: none !important;
        border: 1px solid #ddd;
        break-inside: avoid;
      }
      .mine {
        grid-template-columns: 90px 1fr;
        padding: 12px;
        border-radius: 14px;
      }
      .visual { min-height: 88px; border-radius: 14px; font-size: 38px; }
      .section-title { margin: 16px 0 8px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .role-card { min-height: 96px; padding: 10px; border-radius: 12px; gap: 6px; }
      .thumb { width: 32px; height: 32px; border-radius: 10px; }
      .role-card h3 { font-size: 13px; }
      .role-card p { font-size: 11px; }
    }
  </style>
</head>

    ];
    roles.forEach((role) => {
      role.group = roleGroup(role);
    });

    const params = new URLSearchParams(location.search);
    const room = normalizeRoom(params.get("room")) || "404";
    const date = isValidDate(params.get("date")) ? params.get("date") : todayLocal();
    const seat = seats.includes(params.get("seat")) ? params.get("seat") : "1-1";
    const excludeSeats = parseList(params.get("excludeSeats")).filter((value) => seats.includes(value));
    const excludeRoles = parseList(params.get("excludeRoles")).map(Number).filter((value) => roles.some((role) => role.id === value));
    const assignments = buildAssignmentsComplex(room, date, { excludedSeats: excludeSeats, excludedRoles: excludeRoles });
    const mine = assignments.find((item) => item.seat === seat) || { seat, roles: [] };
    const signNoticeKey = `signNotice_${room}_${date}_${seat}`;

    document.getElementById("pageTitle").textContent = `${room}호 청소분담`;
    document.getElementById("dateMeta").textContent = `${displayDate(date)} 청소점검`;
    document.getElementById("seatMeta").textContent = `내 침대번호 ${seat}`;

    renderMine();
    renderGrid();

    document.getElementById("copyLink").addEventListener("click", copyCurrentLink);
    document.getElementById("printPdf").addEventListener("click", () => window.print());
    document.getElementById("modalClose").addEventListener("click", closeDetailModal);
    document.getElementById("detailModal").addEventListener("click", (event) => {
      if (event.target.id === "detailModal") closeDetailModal();

      if (event.target.id === "signModal") closeSignModal();

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeDetailModal();
        closeSignModal();
      }
    });

    function normalizeRoom(value) {
      return String(value || "").replace(/호/g, "").trim();
    }
    function todayLocal() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function isValidDate(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
    }
    function displayDate(value) {
      return value.replace(/-/g, ".");
    }
    function parseList(value) {
      return String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
    }
    function xmur3(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i += 1) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^= h >>> 16) >>> 0;
      };
    }
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function seededRandom(seedText) {
      return mulberry32(xmur3(seedText)());
    }
    function shuffleSeeded(list, seedText) {
      const rand = seededRandom(seedText);
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(rand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    // 복합 시드 기반 공정 랜덤:
    // 호실·날짜·침대번호·역할번호·그룹 보정값을 함께 계산해 고정 랜덤 점수로 배정합니다.
    function buildAssignmentsComplex(roomValue, dateValue, options = {}) {
      const excludedSeatSet = new Set(options.excludedSeats || []);
      const excludedRoleSet = new Set((options.excludedRoles || []).map(Number));
      const activeSeats = seats.filter((seatValue) => !excludedSeatSet.has(seatValue));
      const activeRoles = roles.filter((role) => !excludedRoleSet.has(role.id));
      if (!activeSeats.length) return [];

      let bestAssignments = [];
      let bestScore = Infinity;
      for (let attempt = 0; attempt < 30; attempt += 1) {
        const seedBase = `${roomValue}|${dateValue}|cleaning-v2|seats:${activeSeats.join(",")}|roles:${activeRoles.map((role) => role.id).join(",")}|attempt-${attempt}`;
        const candidate = buildAssignmentsForSeed(activeSeats, activeRoles, seedBase);
        const score = patternScore(candidate);
        if (score < bestScore) {
          bestScore = score;
          bestAssignments = candidate;
        }
      }
      return bestAssignments;
    }

    function buildAssignmentsForSeed(activeSeats, activeRoles, seedBase) {
      const result = activeSeats.map((seatValue) => ({ seat: seatValue, roles: [] }));
      const assignedRoleIds = new Set();
      const firstRoundLimit = Math.min(activeSeats.length, activeRoles.length);

      for (let round = 0; round < firstRoundLimit; round += 1) {
        const pair = availablePairs(result, activeRoles, assignedRoleIds, seedBase)
          .filter((item) => item.assignment.roles.length === 0)
          .sort((a, b) => a.score - b.score)[0];
        if (!pair) break;
        pair.assignment.roles.push(pair.role);
        assignedRoleIds.add(pair.role.id);
      }

      while (assignedRoleIds.size < activeRoles.length) {
        const pair = availablePairs(result, activeRoles, assignedRoleIds, seedBase)
          .sort((a, b) => a.score - b.score)[0];
        if (!pair) break;
        pair.assignment.roles.push(pair.role);
        assignedRoleIds.add(pair.role.id);
      }

      return result;
    }

    function availablePairs(assignments, activeRoles, assignedRoleIds, seedBase) {
      const minLoad = Math.min(...assignments.map((item) => item.roles.length));
      const maxAllowedLoad = minLoad + 1;
      const pairs = [];
      assignments.forEach((assignment) => {
        if (assignment.roles.length > maxAllowedLoad) return;
        activeRoles.forEach((role) => {
          if (assignedRoleIds.has(role.id)) return;
          pairs.push({
            assignment,
            role,
            score: pairScore(seedBase, assignment.seat, role, assignment.roles.length)
          });
        });
      });
      return pairs;
    }

    function pairScore(seedBase, seatValue, role, currentLoad) {
      const seatIndex = seats.indexOf(seatValue);
      const groupNoise = hashToNumber(`${seedBase}|${role.group}|${seatValue}|group-mix`);
      const positionNoise = hashToNumber(`${seedBase}|${seatIndex}|${role.id}|position-mix`);
      const loadNoise = hashToNumber(`${seedBase}|${seatValue}|${currentLoad}|load-balance`);
      let score =
        hashToNumber(`${seedBase}|${seatValue}|${role.id}|pair`) +
        hashToNumber(`${seedBase}|${role.id}|${seatValue}|reverse`) * 0.37 +
        hashToNumber(`${seedBase}|${seatValue}|seatBias`) * 0.11 +
        hashToNumber(`${seedBase}|${role.id}|roleBias`) * 0.07 +
        groupNoise * 0.19 +
        positionNoise * 0.13 +
        loadNoise * 0.17 +
        currentLoad * 0.43;

      if (["toilet", "shower", "sink"].includes(role.group)) {
        score += hashToNumber(`${seedBase}|${role.group}|${Math.floor(seatIndex / 2)}|hard-zone`) * 0.21;
      }
      return score;
    }

    function patternScore(assignments) {
      const rolePositions = [];
      assignments.forEach((assignment) => {
        assignment.roles.forEach((role) => {
          rolePositions.push({ seat: assignment.seat, seatIndex: seats.indexOf(assignment.seat), role });
        });
      });

      let penalty = 0;
      const groups = ["toilet", "shower", "sink", "trash"];
      groups.forEach((group) => {
        const positions = rolePositions
          .filter((item) => item.role.group === group)
          .map((item) => item.seatIndex)
          .sort((a, b) => a - b);
        for (let i = 1; i < positions.length; i += 1) {
          const gap = positions[i] - positions[i - 1];
          if (gap <= 2) penalty += (3 - gap) * 5;
        }
        if (positions.length >= 3) {
          const allFront = positions.every((pos) => pos <= 7);
          const allBack = positions.every((pos) => pos >= 8);
          if (allFront || allBack) penalty += 18;
        }
      });

      const sortedBySeat = rolePositions.slice().sort((a, b) => a.seatIndex - b.seatIndex);
      let orderedPairs = 0;
      for (let i = 1; i < sortedBySeat.length; i += 1) {
        if (sortedBySeat[i].role.id > sortedBySeat[i - 1].role.id) orderedPairs += 1;
      }
      const monotonicRatio = sortedBySeat.length > 1 ? orderedPairs / (sortedBySeat.length - 1) : 0;
      if (monotonicRatio > 0.72 || monotonicRatio < 0.28) penalty += 16;

      const trash = rolePositions.find((item) => item.role.group === "trash");
      if (trash && trash.seatIndex >= 12) penalty += 7;
      if (trash && trash.seatIndex <= 2) penalty += 4;

      const loads = assignments.map((item) => item.roles.length);
      penalty += (Math.max(...loads) - Math.min(...loads)) * 9;
      return penalty;
    }

    function roleGroup(role) {
      if (role.id === 1) return "shoe";
      if (role.id === 2 || role.id === 8) return "front";
      if (role.id === 3) return "living";
      if (role.id >= 4 && role.id <= 7) return "toilet";
      if (role.id >= 9 && role.id <= 12) return "sink";
      if (role.id >= 13 && role.id <= 15) return "shower";
      if (role.id === 16) return "trash";
      return role.color || "etc";
    }

    function hashToNumber(str) {
      let h1 = 0xdeadbeef;
      let h2 = 0x41c6ce57;

      for (let i = 0; i < str.length; i += 1) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }

      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
      h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
      h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);

      const result = 4294967296 * (2097151 & h2) + (h1 >>> 0);
      return (result % 1000000) / 1000000;
    }
    function renderMine() {
      const mineCard = document.getElementById("mineCard");
      if (!mine.roles.length) {
        mineCard.className = "mine empty";
        mineCard.innerHTML = "오늘 배정된 청소 역할이 없습니다.";
        return;
      }
      mineCard.className = "mine";
      if (mine.roles.length === 1) {
        const role = mine.roles[0];
        mineCard.innerHTML = `
          ${previewCardHtml(role, "visual")}
          <div>
            <h2>${escapeHtml(role.name)}</h2>
            <p class="summary">${escapeHtml(role.summary)}</p>
            <p class="owner">담당: ${escapeHtml(mine.seat)}</p>
            <div class="checks">${role.checks.map((text, index) => checkHtml(role, mine.seat, text, index)).join("")}</div>
            <button class="detail-link" type="button" data-role="${role.id}" data-seat="${mine.seat}">자세히보기</button>
          </div>
        `;
      } else {
        mineCard.innerHTML = `
          <div class="mine-list" style="grid-column:1 / -1">
            <h2>내 청소분담 ${mine.roles.length}개</h2>
            ${mine.roles.map((role) => `
              <article class="role-card mine-card">
                <div class="mini-top">
                  <span class="seat-badge">${escapeHtml(mine.seat)}</span>
                  ${previewCardHtml(role, "thumb")}
                </div>
                <h3>${escapeHtml(role.name)}</h3>
                <p>${escapeHtml(role.summary)}</p>
                <div class="checks">${role.checks.map((text, index) => checkHtml(role, mine.seat, text, index)).join("")}</div>
                <button class="detail-link" type="button" data-role="${role.id}" data-seat="${mine.seat}">자세히보기</button>
              </article>
            `).join("")}
          </div>
        `;
      }
      bindChecks(mineCard, mine.roles[0], mine.seat);
      mineCard.querySelectorAll(".detail-link").forEach((btn) => {
        const role = roles.find((item) => String(item.id) === btn.dataset.role);
        btn.addEventListener("click", () => openDetailModal(role, mine.seat));
      });
    }
    function renderGrid() {
      const grid = document.getElementById("assignmentGrid");
      grid.innerHTML = assignments.map(({ seat: seatValue, roles: seatRoles }) => `
        <article class="role-card ${seatValue === seat ? "mine-card" : ""}">
          <div class="mini-top">
            <span class="seat-badge">${escapeHtml(seatValue)}</span>
            ${seatRoles[0] ? previewCardHtml(seatRoles[0], "thumb") : `<span class="empty-role">담당 없음</span>`}
          </div>
          ${seatRoles.length
            ? `<ul class="role-stack">${seatRoles.map((role) => `<li><strong>${escapeHtml(role.name)}</strong><br>${escapeHtml(role.summary)}<br><button class="detail-link" type="button" data-role="${role.id}" data-seat="${seatValue}">자세히보기</button></li>`).join("")}</ul>`
            : `<p class="empty-role">오늘 담당 없음</p>`}
        </article>
      `).join("");
      grid.querySelectorAll(".detail-link").forEach((btn) => {
        const role = roles.find((item) => String(item.id) === btn.dataset.role);
        btn.addEventListener("click", () => openDetailModal(role, btn.dataset.seat));
      });

    function checkKey(role, seatValue, index) {
      return `clean-check:${room}:${date}:${seatValue}:${role.id}:${index}`;
    }
    function checkHtml(role, seatValue, text, index) {
      const key = checkKey(role, seatValue, index);
      const checked = localStorage.getItem(key) === "1" ? " checked" : "";
      return `<label class="check"><input type="checkbox" data-role="${role.id}" data-seat="${escapeAttr(seatValue)}" data-index="${index}" data-key="${escapeAttr(key)}"${checked}><span>${escapeHtml(text)}</span></label>`;
    }
    function bindChecks(root, role, seatValue) {
      root.querySelectorAll("input[type='checkbox'][data-key]").forEach((input) => {
        input.addEventListener("change", () => {
          localStorage.setItem(input.dataset.key, input.checked ? "1" : "0");
          const inputRole = roles.find((item) => String(item.id) === input.dataset.role) || role;
          const inputSeat = input.dataset.seat || seatValue;
          syncSameCheck(inputRole, inputSeat, input.dataset.index, input.checked);
          maybeShowSignNotice(inputRole, inputSeat);
        });
      });
    }
    function syncSameCheck(role, seatValue, index, checked) {
      document.querySelectorAll(`input[data-role="${role.id}"][data-seat="${cssEscape(seatValue)}"][data-index="${index}"]`).forEach((el) => {
        el.checked = checked;
      });
    }
    function maybeShowSignNotice(role, seatValue) {
      if (!mine.roles.some((mineRole) => mineRole.id === role.id) || seatValue !== mine.seat) return;
      if (localStorage.getItem(signNoticeKey) === "1") return;
      const done = role.checks.every((_, index) => localStorage.getItem(checkKey(role, seatValue, index)) === "1");
      if (!done) return;
      localStorage.setItem(signNoticeKey, "1");
      openSignModal();
    }
    function openDetailModal(role, seatValue) {
      document.getElementById("modalTitle").textContent = role.name;
      document.getElementById("modalOwner").textContent = `담당 침대번호: ${seatValue}`;
      document.getElementById("modalSummary").textContent = `${role.location} - ${role.summary}`;
      document.getElementById("modalCaution").textContent = role.caution;
      document.getElementById("modalImage").innerHTML = imageHtml(role.detailImage, `${role.name} 위치 안내 이미지`);
      document.getElementById("modalChecks").innerHTML = role.checks.map((text, index) => checkHtml(role, seatValue, text, index)).join("");
      bindChecks(document.getElementById("modalChecks"), role, seatValue);
      document.getElementById("detailModal").classList.add("open");
    }
    function closeDetailModal() {
      document.getElementById("detailModal").classList.remove("open");
      renderMine();
    }
    function openSignModal() {
      const rand = Math.floor(Math.random() * completeMessages.length);
      document.getElementById("signMessage").textContent = completeMessages[rand];
      document.getElementById("signImage").innerHTML = imageHtml(imageAssets.signGuide, "청소 확인표 싸인 안내 이미지");
      document.getElementById("signModal").classList.add("open");
    }
    function closeSignModal() {
      document.getElementById("signModal").classList.remove("open");
    }
    function imageHtml(src, alt) {
      if (!src) return `<div class="image-fallback">이미지 준비중</div>`;
      return `<img src="${escapeAttr(src)}" alt="${escapeAttr(alt)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'image-fallback',textContent:'이미지 준비중'}))">`;
    }
    function previewCardHtml(role, className) {
      const bg = role.previewBg || "#eef9f6";
      return `<div class="${className} ${role.color}" style="background:${escapeAttr(bg)}" aria-label="${escapeAttr(role.name)} 대표 아이콘">${escapeHtml(role.previewIcon || "")}</div>`;
    }
    async function copyCurrentLink() {
      const query = new URLSearchParams({ room, date });
      if (excludeSeats.length) query.set("excludeSeats", excludeSeats.join(","));
      if (excludeRoles.length) query.set("excludeRoles", excludeRoles.join(","));
      const url = new URL(`index.html?${query.toString()}`, location.href).href;
      try {
        await navigator.clipboard.writeText(url);
        showToast("공유 링크를 복사했어요");
      } catch (error) {
        const temp = document.createElement("input");
        temp.value = url;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
        showToast("공유 링크를 복사했어요");
      }
    }
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1700);
    }
    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/["\\]/g, "\\$&");
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청소분담실</title>
  <style>
    :root {
      --mint: #bfeee4;
      --sky: #dbeeff;
      --lavender: #e8defc;
      --cream: #fff8dc;
      --ink: #263238;
      --muted: #74808a;
      --line: #edf0f4;
      --shadow: 0 20px 50px rgba(56, 73, 89, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 12%, rgba(191, 238, 228, .9) 0 84px, transparent 86px),
        radial-gradient(circle at 84% 5%, rgba(232, 222, 252, .9) 0 74px, transparent 76px),
        linear-gradient(180deg, #ffffff 0%, #fbfdff 55%, #fffaf0 100%);
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app {
      width: min(470px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 18px 28px;
      display: grid;
      align-content: center;
      gap: 18px;
    }
    .hero { text-align: center; padding: 10px 10px 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 74px;
      height: 74px;
      margin-bottom: 18px;
      border-radius: 26px;
      background: linear-gradient(135deg, var(--mint), var(--sky));
      box-shadow: 0 14px 28px rgba(79, 144, 168, .18);
      font-size: 38px;
    }
    h1 { margin: 0; font-size: 38px; line-height: 1.1; font-weight: 900; }
    .intro {
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      font-weight: 700;
    }
    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .field { display: grid; gap: 10px; margin-bottom: 18px; }
    .field span { font-size: 14px; font-weight: 900; color: #43515d; }
    input, .date-button {
      width: 100%;
      min-height: 54px;
      border: 1px solid #e3e8ee;
      border-radius: 18px;
      background: #fff;
      padding: 15px 16px;
      color: var(--ink);
      outline: 0;
      font-weight: 800;
    }
    input:focus, .date-button:focus-visible {
      border-color: #8ed9cf;
      box-shadow: 0 0 0 4px rgba(191,238,228,.5);
    }
    .date-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }
    .date-value { font-size: 16px; }
    .date-icon {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e0f7f1, #eee7ff);
      color: #5c6680;
      font-size: 20px;
      flex: 0 0 auto;
    }
    .room-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .chip {
      min-height: 42px;
      border-radius: 999px;
      background: #f3f8fb;
      color: #52616d;
      font-weight: 900;
    }
    .chip.active { background: #dff7f1; color: #12675b; }
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .seat {
      min-height: 46px;
      border-radius: 16px;
      background: #f7f5ff;
      color: #655a7d;
      font-weight: 900;
      border: 1px solid #ede8ff;
    }
    .seat.active {
      background: linear-gradient(135deg, #efe7ff, #dff7f1);
      border-color: #c8baef;
      color: #372f53;
      box-shadow: 0 10px 18px rgba(132,112,176,.15);
    }
    .submit {
      width: 100%;
      min-height: 58px;
      margin-top: 6px;
      border-radius: 22px;
      background: linear-gradient(135deg, #8bded2, #bca9ef);
      color: #fff;
      font-size: 17px;
      font-weight: 950;
      box-shadow: 0 16px 24px rgba(105,143,184,.22);
    }
    .hint {
      margin: 14px 0 0;
      color: #8a95a1;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      font-weight: 700;
    }
    .shared-notice {
      display: none;
      margin: 0 0 18px;
      padding: 13px 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #e3f8f3, #f1ecff);
      color: #485865;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 850;
    }
    .shared-notice.show { display: block; }
    .calendar-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 16px;
      background: rgba(45, 55, 67, .34);
    }
    .calendar-backdrop.open { display: flex; }
    .calendar-sheet {
      width: min(430px, 100%);
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(35,45,58,.24);
      padding: 18px;
      animation: sheetIn .2s ease-out;
    }
    @keyframes sheetIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .month-title { font-size: 19px; font-weight: 950; }
    .month-nav {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: #f5f7fb;
      color: #52616d;
      font-size: 22px;
      font-weight: 900;
    }
    .week, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .week span {
      padding: 8px 0;
      text-align: center;
      color: #8b96a3;
      font-size: 12px;
      font-weight: 900;
    }
    .day {
      aspect-ratio: 1;
      border-radius: 16px;
      background: transparent;
      color: #40505c;
      font-weight: 900;
    }
    .day.blank { pointer-events: none; }
    .day.today { border: 1px solid #92dcd2; }
    .day.selected {
      background: linear-gradient(135deg, #8bded2, #bba8ef);
      color: #fff;
      box-shadow: 0 10px 18px rgba(132,112,176,.18);
    }
    .calendar-foot {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .calendar-foot button {
      flex: 1;
      min-height: 44px;
      border-radius: 16px;
      background: #f5f7fb;
      color: #52616d;
      font-weight: 950;
    }
    .calendar-foot .today-btn { background: #e3f8f3; color: #11665c; }
    @media (max-width: 380px) {
      .app { padding-inline: 12px; }
      .card { padding: 18px; border-radius: 24px; }
      .seat-grid { grid-template-columns: repeat(3, 1fr); }
      h1 { font-size: 34px; }
      .calendar-sheet { padding: 14px; border-radius: 24px; }
      .day { border-radius: 13px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="badge" aria-hidden="true">🧹</div>
      <h1>청소분담실</h1>
      <p class="intro">오늘의 청소 역할을 확인해요.<br>방과 침대를 선택하면<br>내 청소분담을 볼 수 있습니다.</p>
    </section>

    <form class="card" id="entryForm">
      <p class="shared-notice" id="sharedNotice">공유된 청소분담 링크입니다. 내 침대번호를 선택하면 내 청소분담을 볼 수 있어요.</p>

      <label class="field">
        <span>호실</span>
        <input id="roomInput" name="room" inputmode="numeric" autocomplete="off" placeholder="404" required>
        <div class="room-row" aria-label="호실 빠른 선택">
          <button class="chip" type="button" data-room="404">404호</button>
          <button class="chip" type="button" data-room="405">405호</button>
          <button class="chip" type="button" data-room="406">406호</button>
        </div>
      </label>

      <div class="field">
        <span>청소점검 날짜</span>
        <button class="date-button" id="dateButton" type="button" aria-haspopup="dialog">
          <span class="date-value" id="dateDisplay"></span>
          <span class="date-icon" aria-hidden="true">▦</span>
        </button>
      </div>

      <div class="field">
        <span>내 침대번호</span>
        <div class="seat-grid" id="seatGrid"></div>
      </div>

      <button class="submit" type="submit">청소분담 뽑기 시작</button>
      <p class="hint">같은 호실과 같은 날짜라면 모든 기기에서 같은 결과가 나옵니다.</p>
    </form>
  </main>

  <div class="calendar-backdrop" id="calendarBackdrop" role="dialog" aria-modal="true" aria-labelledby="calendarTitle">
    <section class="calendar-sheet">
      <div class="calendar-head">
        <button class="month-nav" id="prevMonth" type="button" aria-label="이전 달">‹</button>
        <div class="month-title" id="calendarTitle"></div>
        <button class="month-nav" id="nextMonth" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="week" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="days" id="calendarDays"></div>
      <div class="calendar-foot">
        <button class="today-btn" id="todayButton" type="button">오늘</button>
        <button id="closeCalendar" type="button">닫기</button>
      </div>
    </section>
  </div>

  <script>
    const seats = ["1-1","1-2","2-1","2-2","3-1","3-2","4-1","4-2","5-1","5-2","6-1","6-2","7-1","7-2","8-1","8-2"];
    const params = new URLSearchParams(location.search);
    const roomInput = document.getElementById("roomInput");
    const seatGrid = document.getElementById("seatGrid");
    const dateDisplay = document.getElementById("dateDisplay");
    const calendarBackdrop = document.getElementById("calendarBackdrop");
    const calendarDays = document.getElementById("calendarDays");
    const isSharedLink = params.get("shared") === "1";
    let selectedSeat = params.get("seat") || "";
    let selectedDate = isValidDate(params.get("date")) ? params.get("date") : todayLocal();
    let calendarCursor = parseDate(selectedDate);

    function todayLocal() {
      const d = new Date();
      return formatDate(d);
    }
    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }
    function displayDate(value) {
      return value.replace(/-/g, ".");
    }
    function parseDate(value) {
      const [y, m, d] = value.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function isValidDate(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
    }
    function normalizeRoom(value) {
      return String(value || "").replace(/호/g, "").trim();
    }
    function syncRoomChips() {
      const current = normalizeRoom(roomInput.value);
      document.querySelectorAll("[data-room]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.room === current);
      });
    }
    function updateDateDisplay() {
      dateDisplay.textContent = displayDate(selectedDate);
    }
    function openCalendar() {
      calendarCursor = parseDate(selectedDate);
      renderCalendar();
      calendarBackdrop.classList.add("open");
    }
    function closeCalendar() {
      calendarBackdrop.classList.remove("open");
    }
    function renderCalendar() {
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth();
      const first = new Date(year, month, 1);
      const lastDate = new Date(year, month + 1, 0).getDate();
      const today = todayLocal();
      document.getElementById("calendarTitle").textContent = `${year}년 ${month + 1}월`;
      calendarDays.innerHTML = "";
      for (let i = 0; i < first.getDay(); i += 1) {
        const blank = document.createElement("button");
        blank.type = "button";
        blank.className = "day blank";
        blank.tabIndex = -1;
        calendarDays.appendChild(blank);
      }
      for (let day = 1; day <= lastDate; day += 1) {
        const value = formatDate(new Date(year, month, day));
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day";
        btn.textContent = day;
        btn.classList.toggle("today", value === today);
        btn.classList.toggle("selected", value === selectedDate);
        btn.addEventListener("click", () => {
          selectedDate = value;
          updateDateDisplay();
          closeCalendar();
        });
        calendarDays.appendChild(btn);
      }
    }

    roomInput.value = normalizeRoom(params.get("room")) || "404";
    updateDateDisplay();
    seats.forEach((seat) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "seat";
      button.textContent = seat;
      button.dataset.seat = seat;
      button.addEventListener("click", () => {
        selectedSeat = seat;
        document.querySelectorAll(".seat").forEach((el) => el.classList.toggle("active", el.dataset.seat === selectedSeat));
      });
      seatGrid.appendChild(button);
    });
    selectedSeat = seats.includes(selectedSeat) ? selectedSeat : (isSharedLink ? "" : "1-1");
    if (selectedSeat) {
      document.querySelector(`[data-seat="${selectedSeat}"]`).classList.add("active");
    }
    document.getElementById("sharedNotice").classList.toggle("show", isSharedLink);

    document.querySelectorAll("[data-room]").forEach((btn) => {
      btn.addEventListener("click", () => {
        roomInput.value = btn.dataset.room;
        syncRoomChips();
      });
    });
    roomInput.addEventListener("input", syncRoomChips);
    document.getElementById("dateButton").addEventListener("click", openCalendar);
    document.getElementById("closeCalendar").addEventListener("click", closeCalendar);
    document.getElementById("todayButton").addEventListener("click", () => {
      selectedDate = todayLocal();
      calendarCursor = parseDate(selectedDate);
      updateDateDisplay();
      closeCalendar();
    });
    document.getElementById("prevMonth").addEventListener("click", () => {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);
      renderCalendar();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
      renderCalendar();
    });
    calendarBackdrop.addEventListener("click", (event) => {
      if (event.target === calendarBackdrop) closeCalendar();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeCalendar();
    });
    syncRoomChips();

    document.getElementById("entryForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const room = normalizeRoom(roomInput.value);
      if (!room || !selectedDate) return;
      if (!selectedSeat) {
        window.alert("내 침대번호를 선택해주세요.");
        return;
      }
      const query = new URLSearchParams({ room, date: selectedDate, seat: selectedSeat });
      location.href = `00-index.html?${query.toString()}`;
    });
  </script>
</body>
</html>
